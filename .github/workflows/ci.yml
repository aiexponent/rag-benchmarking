name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test,lint]"

      - name: Lint (ruff check)
        run: python -m ruff check src tests

      - name: Format (ruff format --check)
        run: python -m ruff format --check src tests

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Unit tests
        run: python -m pytest tests/unit/ -v

      - name: Integration tests
        run: python -m pytest tests/integration/ -v

      - name: E2E API tests
        run: python -m pytest tests/e2e/ -v

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[test]"

      - name: Install security tools
        run: pip install pip-audit

      - name: Dependency vulnerability audit
        # Advisories waived below are ones rag-benchmarking is verified not exposed to and that
        # cannot or need not be fixed upstream yet. Re-audit each on any dependency bump.
        #  PYSEC-2026-3447 (setuptools, CVE-2026-59890): MANIFEST.in exclusion bypass. Not exposed at runtime.
        #  PYSEC-2026-76 (langchain-openai, CVE-2026-21840): SSRF in _url_to_size token counting for images.
        #    rag-benchmarking does not invoke image token counting.
        #  PYSEC-2026-2447 (diskcache, CVE-2026-2447): Pickle deserialization in cache directory.
        #    rag-benchmarking operates in isolated runtime without external cache writes.
        #  PYSEC-2026-3046 (ragas): SSRF in multi_modal_faithfulness when processing retrieved file URLs.
        #    rag-benchmarking only runs text evaluation and does not invoke multi_modal_faithfulness.
        run: |
          pip-audit --desc \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-76 \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-3046
